[project]
name = "deers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.20.0",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
testpaths = ["tests"]
